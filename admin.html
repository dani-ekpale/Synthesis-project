<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Ekpale Estates</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23e0a526'/%3E%3Cpath d='M10 29V17.5L20 9l10 8.5V29h-6.5v-8h-7v8H10z' fill='%230c1122'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Mock route guard: runs before first paint so non-admins never see the dashboard.
       (Client-side only — NOT real security. A backend replaces this in v2.) -->
  <script>
    (function () {
      var ok = false;
      try { ok = localStorage.getItem('isAdmin') === 'true'; } catch (e) {}
      if (!ok) location.replace('index.html');
    })();
  </script>
</head>
<body data-page="admin" class="admin">

  <header class="admin-bar">
    <div class="container admin-bar__inner">
      <a class="brand" href="index.html" aria-label="Back to site">
        <svg class="brand__mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#e0a526"/><path d="M10 29V17.5L20 9l10 8.5V29h-6.5v-8h-7v8H10z" fill="#0c1122"/></svg>
        <span><span class="brand__name">Ekpale</span><span class="brand__sub">ADMIN</span></span>
      </a>
      <div class="admin-bar__right">
        <a class="btn btn--ghost-light btn--sm" href="index.html">View site</a>
        <button type="button" class="btn btn--gold btn--sm" id="logoutBtn">Sign out</button>
      </div>
    </div>
  </header>

  <main class="container admin-main">
    <div class="admin-title">
      <div>
        <p class="kicker">Dashboard</p>
        <h1 class="display">Manage listings &amp; leads</h1>
      </div>
    </div>

    <div class="admin-stats" id="adminStats"></div>

    <div class="admin-tabs" role="tablist" aria-label="Dashboard sections">
      <button type="button" role="tab" class="active" data-tab="listings" aria-selected="true">Listings <span class="count" id="countListings">0</span></button>
      <button type="button" role="tab" data-tab="leads" aria-selected="false">Inquiries <span class="count" id="countLeads">0</span></button>
    </div>

    <!-- ===== Listings tab ===== -->
    <section id="tab-listings" class="panel" role="tabpanel">
      <div class="toolbar">
        <input type="search" id="lstSearch" placeholder="Search title or location…" aria-label="Search listings">
        <select id="lstCat" aria-label="Filter by listing type">
          <option value="">All listing types</option>
          <option value="buy">Buy</option>
          <option value="rent">Rent</option>
          <option value="shortlet">Shortlet</option>
        </select>
        <span class="toolbar__spacer"></span>
        <button type="button" class="btn btn--ghost btn--sm" id="resetData">Reset demo data</button>
        <button type="button" class="btn btn--dark btn--sm" id="addBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Add property
        </button>
      </div>
      <p class="hint">Setting a status to <strong>Sold</strong> or <strong>Let</strong> hides the listing from the public portal but keeps it here.</p>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Property</th><th>Type</th><th>Listing</th><th class="num">Price (GH₵)</th>
              <th>Status</th><th>Premium</th><th>Listed</th><th class="actions-col">Actions</th>
            </tr>
          </thead>
          <tbody id="listingBody"></tbody>
        </table>
      </div>
    </section>

    <!-- ===== Leads tab ===== -->
    <section id="tab-leads" class="panel" role="tabpanel" hidden>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr><th>Received</th><th>Buyer</th><th>Property</th><th>Message</th><th>Status</th><th class="actions-col">Actions</th></tr>
          </thead>
          <tbody id="leadBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- ===================== ADD / EDIT PROPERTY MODAL ===================== -->
  <div class="modal" id="propertyModal" role="dialog" aria-modal="true" aria-labelledby="formTitle" aria-hidden="true">
    <div class="modal__panel modal__panel--md">
      <button type="button" class="modal__close modal__close--flat" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <h2 class="modal__title" id="formTitle">Add property</h2>
      <form id="propertyForm" novalidate>
        <div class="form-grid">
          <div class="fg fg--full">
            <label for="pTitle">Title</label>
            <input id="pTitle" type="text" maxlength="90" placeholder="e.g. The Palms Villa" required>
            <span class="err" data-err="title"></span>
          </div>

          <div class="fg">
            <label for="pCategory">Listing type</label>
            <select id="pCategory">
              <option value="buy">Buy</option>
              <option value="rent">Rent</option>
              <option value="shortlet">Shortlet</option>
            </select>
          </div>
          <div class="fg">
            <label for="pType">Property type</label>
            <select id="pType"></select>
          </div>

          <div class="fg">
            <label for="pStatus">Status</label>
            <select id="pStatus"></select>
          </div>
          <div class="fg">
            <label for="pPrice" id="pPriceLbl">Price (GH₵)</label>
            <input id="pPrice" type="number" min="1" step="1" inputmode="numeric" required>
            <span class="err" data-err="price"></span>
          </div>

          <div class="fg">
            <label for="pLocation">Location / area</label>
            <input id="pLocation" type="text" list="locationList" placeholder="e.g. East Legon" required>
            <datalist id="locationList"></datalist>
            <span class="err" data-err="location"></span>
          </div>
          <div class="fg">
            <label for="pAddress">Address</label>
            <input id="pAddress" type="text" placeholder="Street, area, city">
          </div>

          <div class="fg fg--quad">
            <label for="pBeds">Beds</label>
            <input id="pBeds" type="number" min="0" max="50" step="1" value="0">
          </div>
          <div class="fg fg--quad">
            <label for="pBaths">Baths</label>
            <input id="pBaths" type="number" min="0" max="50" step="0.5" value="0">
          </div>
          <div class="fg fg--quad">
            <label for="pSqm">Size (m²)</label>
            <input id="pSqm" type="number" min="0" step="1" value="0">
          </div>
          <div class="fg fg--quad">
            <label for="pParking">Parking</label>
            <input id="pParking" type="number" min="0" max="50" step="1" value="0">
          </div>

          <div class="fg fg--full">
            <label for="pImage">Image URL <span class="opt">(optional — a placeholder is used if empty)</span></label>
            <input id="pImage" type="url" placeholder="https://…">
            <span class="err" data-err="image"></span>
          </div>
          <div class="fg fg--full">
            <label for="pDescription">Description</label>
            <textarea id="pDescription" rows="3" maxlength="800"></textarea>
          </div>
          <div class="fg fg--full">
            <label for="pFeatures">Features <span class="opt">(comma separated)</span></label>
            <input id="pFeatures" type="text" placeholder="Swimming pool, Generator, 24/7 security">
          </div>
          <label class="check fg--full"><input type="checkbox" id="pPremium"> <span>Premium listing (gold highlight)</span></label>
        </div>

        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" data-close>Cancel</button>
          <button type="submit" class="btn btn--dark" id="saveBtn">Save property</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===================== CONFIRM MODAL ===================== -->
  <div class="modal" id="confirmModal" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMsg" aria-hidden="true">
    <div class="modal__panel modal__panel--sm">
      <h2 class="modal__title" id="confirmTitle">Are you sure?</h2>
      <p class="modal__sub" id="confirmMsg"></p>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" data-close>Cancel</button>
        <button type="button" class="btn btn--danger" id="confirmOk">Delete</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
